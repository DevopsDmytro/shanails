openapi: 3.0.3
info:
  title: Nail Salon Booking API
  description: API for managing nail salon bookings, services, and appointments
  version: 1.0.0
  contact:
    name: API Support
    email: support@shanails.com
servers:
  - url: https://api.shanails.com/v1
    description: Production server
  - url: http://localhost:3000/v1
    description: Development server

paths:
  # Authentication endpoints
  /auth/login:
    post:
      summary: Admin login
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # Service endpoints
  /services:
    get:
      summary: Get all available services
      tags: [Services]
      parameters:
        - name: category
          in: query
          schema:
            type: string
          description: Filter by service category
        - name: active
          in: query
          schema:
            type: boolean
            default: true
          description: Filter by active status
      responses:
        '200':
          description: List of services
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'

  /services/{id}:
    get:
      summary: Get service by ID
      tags: [Services]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Service details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '404':
          $ref: '#/components/responses/NotFound'

  # Master endpoints
  /masters:
    get:
      summary: Get all available masters
      tags: [Masters]
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
            default: true
          description: Filter by active status
        - name: specialization
          in: query
          schema:
            type: string
          description: Filter by specialization
      responses:
        '200':
          description: List of masters
          content:
            application/json:
              schema:
                type: object
                properties:
                  masters:
                    type: array
                    items:
                      $ref: '#/components/schemas/Master'

  /masters/{id}/availability:
    get:
      summary: Get master availability for date range
      tags: [Masters]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Available time slots
          content:
            application/json:
              schema:
                type: object
                properties:
                  masterId:
                    type: integer
                  availability:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        timeSlots:
                          type: array
                          items:
                            type: object
                            properties:
                              startTime:
                                type: string
                                format: time
                              endTime:
                                type: string
                                format: time
                              available:
                                type: boolean

  # Appointment endpoints
  /appointments:
    get:
      summary: Get appointments (filtered by user role)
      tags: [Appointments]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          schema:
            type: string
            enum: [SCHEDULED, CONFIRMED, IN_PROGRESS, COMPLETED, CANCELLED, NO_SHOW]
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of appointments
          content:
            application/json:
              schema:
                type: object
                properties:
                  appointments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Appointment'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create new appointment
      tags: [Appointments]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentRequest'
      responses:
        '201':
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Time slot not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /appointments/{id}:
    get:
      summary: Get appointment by ID
      tags: [Appointments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Appointment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update appointment
      tags: [Appointments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppointmentRequest'
      responses:
        '200':
          description: Appointment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      summary: Cancel appointment
      tags: [Appointments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Appointment cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'

  # Review endpoints
  /appointments/{id}/review:
    post:
      summary: Create review for completed appointment
      tags: [Reviews]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # Admin endpoints
  /admin/users:
    get:
      summary: Get all users (admin only)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [CUSTOMER, MASTER, ADMIN]
        - name: active
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{id}/block:
    post:
      summary: Block/unblock user (admin only)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocked]
              properties:
                blocked:
                  type: boolean
                reason:
                  type: string
      responses:
        '200':
          description: User status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/analytics:
    get:
      summary: Get business analytics (admin only)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analytics'

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        telegramId:
          type: integer
        email:
          type: string
          format: email
        phone:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [CUSTOMER, MASTER, ADMIN]
        isActive:
          type: boolean
        isBlocked:
          type: boolean
        isUnreliable:
          type: boolean
        timezone:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Service:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: decimal
        duration:
          type: integer
        category:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Master:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        employeeCode:
          type: string
        commissionRate:
          type: number
          format: decimal
        isActive:
          type: boolean
        specializations:
          type: array
          items:
            type: string
        experience:
          type: integer
        user:
          $ref: '#/components/schemas/User'

    Appointment:
      type: object
      properties:
        id:
          type: integer
        customerId:
          type: integer
        masterId:
          type: integer
        serviceIds:
          type: array
          items:
            type: integer
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          type: string
          enum: [SCHEDULED, CONFIRMED, IN_PROGRESS, COMPLETED, CANCELLED, NO_SHOW]
        totalPrice:
          type: number
          format: decimal
        customerNotes:
          type: string
        adminNotes:
          type: string
        reminderSent:
          type: boolean
        feedbackRequested:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        customer:
          $ref: '#/components/schemas/User'
        master:
          $ref: '#/components/schemas/Master'
        services:
          type: array
          items:
            $ref: '#/components/schemas/Service'

    CreateAppointmentRequest:
      type: object
      required: [masterId, serviceIds, startTime]
      properties:
        masterId:
          type: integer
        serviceIds:
          type: array
          items:
            type: integer
          minItems: 1
        startTime:
          type: string
          format: date-time
        customerNotes:
          type: string
          maxLength: 500

    UpdateAppointmentRequest:
      type: object
      properties:
        masterId:
          type: integer
        serviceIds:
          type: array
          items:
            type: integer
        startTime:
          type: string
          format: date-time
        status:
          type: string
          enum: [SCHEDULED, CONFIRMED, IN_PROGRESS, COMPLETED, CANCELLED, NO_SHOW]
        customerNotes:
          type: string
          maxLength: 500
        adminNotes:
          type: string

    Review:
      type: object
      properties:
        id:
          type: integer
        appointmentId:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateReviewRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000

    Analytics:
      type: object
      properties:
        totalBookings:
          type: integer
        completedBookings:
          type: integer
        cancelledBookings:
          type: integer
        noShowRate:
          type: number
          format: decimal
        totalRevenue:
          type: number
          format: decimal
        bookingsPerMonth:
          type: array
          items:
            type: object
            properties:
              month:
                type: string
              count:
                type: integer
        bookingsPerMaster:
          type: array
          items:
            type: object
            properties:
              masterId:
                type: integer
              masterName:
                type: string
              count:
                type: integer
        popularServices:
          type: array
          items:
            type: object
            properties:
              serviceId:
                type: integer
              serviceName:
                type: string
              count:
                type: integer
        averageRating:
          type: number
          format: decimal

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        pages:
          type: integer

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

tags:
  - name: Authentication
    description: Authentication endpoints
  - name: Services
    description: Service management endpoints
  - name: Masters
    description: Master management endpoints
  - name: Appointments
    description: Appointment booking and management
  - name: Reviews
    description: Customer review endpoints
  - name: Admin
    description: Admin-only endpoints