<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shanails - Запис на манікюр</title>
    <meta name="description" content="Запишіться на манікюр та педикюр у найкращих майстрів Києва">
    
    <!-- Telegram WebApp meta tags -->
    <meta name="telegram:web-app" content="Shanails Booking">
    
    <!-- Basic styles -->
    <link rel="stylesheet" href="/src/styles/main.css">
    
    <!-- Theme variables for Telegram integration -->
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-hint-color: #999999;
            --tg-theme-link-color: #2481cc;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
            
            /* Custom colors */
            --primary-color: #ff6b9d;
            --primary-light: #ff8fab;
            --primary-dark: #e55a87;
            --secondary-color: #667eea;
            --success-color: #48bb78;
            --warning-color: #f6ad55;
            --error-color: #fc8181;
            --text-color: #2d3748;
            --text-light: #718096;
            --border-color: #e2e8f0;
            --background-color: #f7fafc;
            --card-background: #ffffff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        /* Dark theme support */
        .dark-theme {
            --tg-theme-bg-color: #1c1c1c;
            --tg-theme-text-color: #ffffff;
            --tg-theme-hint-color: #aaaaaa;
            --tg-theme-link-color: #7ab8ff;
            --tg-theme-button-color: #7ab8ff;
            --tg-theme-button-text-color: #1c1c1c;
            
            --text-color: #ffffff;
            --text-light: #aaaaaa;
            --border-color: #333333;
            --background-color: #1c1c1c;
            --card-background: #2d2d2d;
        }

        /* Base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            line-height: 1.6;
            min-height: 100vh;
        }

        #app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Loading spinner */
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Button styles */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 48px;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn--primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn--primary:hover:not(:disabled) {
            background-color: var(--primary-dark);
        }

        .btn--secondary {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
        }

        .btn--large {
            padding: 16px 32px;
            font-size: 18px;
            min-height: 56px;
        }

        .btn--small {
            padding: 8px 16px;
            font-size: 14px;
            min-height: 36px;
        }

        /* Card styles */
        .card {
            background: var(--card-background);
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        /* Utility classes */
        .text-center { text-align: center; }
        .text-left { text-align: left; }
        .text-right { text-align: right; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-column { flex-direction: column; }
        .align-center { align-items: center; }
        .justify-center { justify-content: center; }
        .gap-1 { gap: 0.25rem; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
    </style>
</head>
<body>
    <div id="app">
        <!-- Loading state -->
        <div class="loading-screen" id="loading-screen">
            <div class="loading-content">
                <div class="spinner"></div>
                <h2>Shanails</h2>
                <p>Завантаження...</p>
            </div>
        </div>
    </div>

    <!-- Main app script -->
    <script type="module" src="/src/app.js"></script>
</body>
</html>
