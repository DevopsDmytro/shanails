name: Production Deployment

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    environment: production

    steps:
      - name: Clean workspace
        run: |
          cd $GITHUB_WORKSPACE || true
          sudo rm -rf letsencrypt || true
          sudo rm -rf deploy-* || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: deploy-${{ github.sha }}

      - name: Create .env file
        working-directory: deploy-${{ github.sha }}
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "PORT=3000" >> .env
          echo "NODE_ENV=production" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "LOG_LEVEL=info" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "MINI_APP_URL=${{ secrets.MINI_APP_URL }}" >> .env
          echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> .env
          echo "FRONTEND_HOST=${{ secrets.FRONTEND_HOST }}" >> .env
          echo "N8N_HOST=${{ secrets.N8N_HOST }}" >> .env
          echo "WEBHOOK_URL=${{ secrets.WEBHOOK_URL }}" >> .env
          echo "GENERIC_TIMEZONE=Europe/Kiev" >> .env
          echo "MAX_SERVICES_PER_APPOINTMENT=3" >> .env
          echo "MAX_APPOINTMENTS_PER_DAY=50" >> .env
          echo "SALON_NAME=Shanails Nail Studio" >> .env
          echo "SALON_ADDRESS=Київ, вул. Хрещатик, 1" >> .env
          echo "SALON_PHONE=+380636720373" >> .env
          echo "SALON_INSTAGRAM=@shanails_studio" >> .env

      - name: Stop old containers
        run: |
          docker stop manicure-bot || true
          docker rm manicure-bot || true
          docker stop shanails-frontend-1 shanails-backend-1 shanails-db-1 || true
          docker rm shanails-frontend-1 shanails-backend-1 shanails-db-1 || true
          # Stop any container using ports 80 and 443
          docker ps -q --filter "publish=80" | xargs -r docker stop || true
          docker ps -q --filter "publish=443" | xargs -r docker stop || true

      - name: Build and deploy with Docker Compose
        working-directory: deploy-${{ github.sha }}
        run: |
          # Export Vite build-time environment variables
          export VITE_DEBUG_MODE=false
          export VITE_TELEGRAM_BOT_USERNAME=sha_nails_bot
          export VITE_API_URL=/api/v1
          
          # Use a fixed project name 'shanails' to ensure we update existing containers
          # instead of creating new ones in a new namespace.
          docker compose -p shanails down --remove-orphans
          docker compose -p shanails up -d --build

      - name: Verify deployment
        run: |
          echo "Waiting for services to start..."
          sleep 20
          
          # Check specific critical services
          SERVICES=("backend" "frontend" "traefik" "n8n" "bot" "db")
          FAILED=0
          
          for service in "${SERVICES[@]}"; do
            # Check if service is running (Up)
            if ! docker compose -p shanails ps | grep "$service" | grep "Up"; then
              echo "Error: Service $service is not running!"
              docker compose -p shanails logs $service
              FAILED=1
            else
              echo "Service $service is running."
            fi
          done
          
          if [ $FAILED -eq 1 ]; then
            exit 1
          fi
          
          echo "All services are running successfully!"

      - name: Seed database (if empty)
        run: |
          echo "Checking if database needs seeding..."
          # Check master count using backend container's Python environment
          MASTER_COUNT=$(docker exec shanails-backend-1 python -c "import os; from sqlalchemy import create_engine, text; engine = create_engine(os.getenv('DATABASE_URL')); conn = engine.connect(); result = conn.execute(text('SELECT COUNT(*) FROM master')); print(result.scalar())" 2>/dev/null || echo "0")
          
          echo "Current master count: $MASTER_COUNT"
          
          if [ "$MASTER_COUNT" -eq "0" ]; then
            echo "Database is empty. Seeding..."
            docker exec shanails-backend-1 python seed.py
            echo "✅ Database seeded successfully"
          else
            echo "Database already has data ($MASTER_COUNT masters). Skipping seed."
          fi

      - name: Health check endpoints
        run: |
          echo "Waiting for services to be fully ready..."
          sleep 10
          
          # Check API health
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.FRONTEND_HOST }}/api/v1/masters/ || echo "000")
          
          if [ "$API_STATUS" = "200" ]; then
            echo "✅ API is healthy (HTTP $API_STATUS)"
          else
            echo "❌ API health check failed (HTTP $API_STATUS)"
            docker compose -p shanails logs backend
            exit 1
          fi
          
          # Check frontend
          FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.FRONTEND_HOST }}/ || echo "000")
          
          if [ "$FRONTEND_STATUS" = "200" ]; then
            echo "✅ Frontend is healthy (HTTP $FRONTEND_STATUS)"
          else
            echo "⚠️  Frontend returned HTTP $FRONTEND_STATUS (may be normal for SSR)"
          fi

      - name: Cleanup old deployment directories
        run: |
          cd $HOME/actions-runner/_work/shanails || exit 0
          ls -t | grep "^deploy-" | tail -n +3 | xargs -r sudo rm -rf

      - name: Prune unused Docker images
        run: docker image prune -f