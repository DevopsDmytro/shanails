name: Production Deployment

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: deploy-${{ github.sha }}

      - name: Create .env file
        working-directory: deploy-${{ github.sha }}
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "PORT=3000" >> .env
          echo "NODE_ENV=production" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "LOG_LEVEL=info" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "MINI_APP_URL=${{ secrets.MINI_APP_URL }}" >> .env
          echo "NGROK_AUTHTOKEN=${{ secrets.NGROK_AUTHTOKEN }}" >> .env
          echo "NGROK_URL=${{ secrets.NGROK_URL }}" >> .env
          echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> .env
          echo "FRONTEND_HOST=${{ secrets.FRONTEND_HOST }}" >> .env
          echo "ACME_EMAIL=${{ secrets.ACME_EMAIL }}" >> .env
          echo "N8N_HOST=${{ secrets.N8N_HOST }}" >> .env
          echo "WEBHOOK_URL=${{ secrets.WEBHOOK_URL }}" >> .env
          echo "GENERIC_TIMEZONE=Europe/Kiev" >> .env
          echo "MAX_SERVICES_PER_APPOINTMENT=3" >> .env
          echo "MAX_APPOINTMENTS_PER_DAY=50" >> .env
          echo "SALON_NAME=Shanails Nail Studio" >> .env
          echo "SALON_ADDRESS=Київ, вул. Хрещатик, 1" >> .env
          echo "SALON_PHONE=+380636720373" >> .env
          echo "SALON_INSTAGRAM=@shanails_studio" >> .env

      - name: Stop old bot container
        run: docker stop manicure-bot || true && docker rm manicure-bot || true

      - name: Build and deploy with Docker Compose
        working-directory: deploy-${{ github.sha }}
        run: |
          docker compose down --remove-orphans
          docker compose up -d --build

      - name: Cleanup old deployment directories
        run: |
          cd $HOME/actions-runner/_work/shanails || exit 0
          ls -t | grep "^deploy-" | tail -n +3 | xargs -r sudo rm -rf

      - name: Prune unused Docker images
        run: docker image prune -f